# Local targets should use host aliases from build-deploy.local.yaml so IP changes
# only require a single config edit before ./build deploy.
#
# Network credentials (HTTP X-Password, Telnet, FTP, and the DMA TCP/64 raw socket
# authenticate command) flow through ${VIVIPI_NETWORK_USERNAME} and
# ${VIVIPI_NETWORK_PASSWORD}. The build script and c64_health_check auto-load
# them from one of the following local-only secrets sources (none of which are
# tracked):
#   1. environment variables already exported in the shell
#   2. .env.local in the repository root (KEY=VALUE lines)
#   3. config/secrets.local (KEY: VALUE YAML mapping)
# Run `cp config/secrets.local.example config/secrets.local` and fill in your
# real password to enable checks against password-protected network listeners.
checks:
  - name: C64U REST
    type: http
    target: http://c64/v1/version
    method: GET
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: C64U FTP
    type: ftp
    target: c64
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: C64U TELNET
    type: telnet
    target: c64:23
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: C64U PING
    type: ping
    target: c64
    interval_s: 10
    timeout_s: 8

  - name: C64U IDENT
    type: ident
    target: c64
    interval_s: 10
    timeout_s: 8

  - name: C64U DMA
    type: dma
    target: c64
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: PIXEL4 ADB
    type: http
    target: http://mickey:8081/vivipi/probe/adb/9B081FFAZ001WX
    method: GET
    interval_s: 10
    timeout_s: 8

  - name: U64 REST
    type: http
    target: http://u64/v1/version
    method: GET
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U64 FTP
    type: ftp
    target: u64
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U64 TELNET
    type: telnet
    target: u64:23
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U64 PING
    type: ping
    target: u64
    interval_s: 10
    timeout_s: 8

  - name: U64 IDENT
    type: ident
    target: u64
    interval_s: 10
    timeout_s: 8

  - name: U64 DMA
    type: dma
    target: u64
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U2 REST
    type: http
    target: http://u2/v1/version
    method: GET
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U2 FTP
    type: ftp
    target: u2
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U2 TELNET
    type: telnet
    target: u2:23
    username: ${VIVIPI_NETWORK_USERNAME}
    password: ${VIVIPI_NETWORK_PASSWORD}
    interval_s: 10
    timeout_s: 8

  - name: U2 PING
    type: ping
    target: u2
    interval_s: 10
    timeout_s: 8

  - name: U2 IDENT
    type: ident
    target: u2
    interval_s: 10
    timeout_s: 8