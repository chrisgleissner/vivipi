# Copy this file to config/build-deploy.local.yaml and fill in your local values.
project:
  name: vivipi

device:
  board: pico2w
  micropython:
    version: 1.25.0
    download_page: https://micropython.org/download/RPI_PICO2_W/
  buttons:
    a: GP15
    b: GP17
    startup_self_test_s: 0
  display:
    mode: standard
    columns: 1
    column_separator: " "
    page_interval: 20s
    boot_logo_duration: 4s
    liveness:
      contrast_breathing:
        enabled: false
        period_s: 30
        amplitude: 16
      per_row_micro:
        enabled: false
        period_s: 15
        stagger: true
      bottom_heartbeat:
        enabled: true
        period_s: 1
        pixel_count: 1
        position: left

wifi:
  ssid: YourWifiName
  password: YourWifiPassword
  host_aliases:
    host-a: 192.168.1.10
    host-b: 192.168.1.11
    host-c: 192.168.1.12

service:
  default_prefix: adb
  syslog:
    host: host-b
    port: 514

check_state:
  failures_to_degraded: 1
  failures_to_failed: 2
  successes_to_recover: 1
  visible_degraded: true

probe_schedule:
  allow_concurrent_hosts: false
  allow_concurrent_same_host: false
  same_host_backoff_ms: 250
  interval_grace_ms: 1000

checks_config: checks.local.yaml

devices:
  oled-lab:
    selector:
      serial_by_id: /dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_YOUR_OLED_BOARD_ID-if00
      bootsel_disk: /dev/disk/by-id/usb-RPI_RP2350_YOUR_OLED_BOARD_ID-0:0
    bootstrap:
      uf2_url: https://micropython.org/resources/firmware/RPI_PICO2_W-20250415-v1.25.0.uf2
      serial_timeout_s: 45
    device:
      display:
        type: waveshare-pico-oled-1.3

  epaper-lab:
    selector:
      serial_by_id: /dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_YOUR_EPAPER_BOARD_ID-if00
      bootsel_disk: /dev/disk/by-id/usb-RPI_RP2350_YOUR_EPAPER_BOARD_ID-0:0
    bootstrap:
      uf2_url: https://micropython.org/resources/firmware/RPI_PICO2_W-20250415-v1.25.0.uf2
      serial_timeout_s: 45
    device:
      display:
        type: waveshare-pico-epaper-2.13-b-v4
        rotation: 180
        page_interval: 180s
        refresh:
          probe_cycles_per_refresh: 1
          min_interval: 0s
        liveness:
          bottom_heartbeat:
            enabled: false
            pixel_width_px: 2
            pixel_height_px: 2
            gap_px: 3
